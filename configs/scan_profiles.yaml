# OhSINT — Scan Profiles

standard:
  description: "Standard recon — core passive tools for quick results"
  tools:
    - subfinder:
        all_sources: true
    - crtsh:
        wildcard: true
    - whois
    - theharvester:
        sources: "google,bing,linkedin,dnsdumpster"
    - shodan:
        mode: "search"
    - metagoofil:
        filetypes: "pdf,doc,xls,ppt,docx,xlsx,pptx"
        max_results: 100
    - github_dorks:
        mode: "org_scan"
    - exiftool:
        mode: "post_metagoofil"
    - dork_cli:
        dorks: "ghdb_passive"
    - brave_search:
        queries: "all"
    - crosslinked:
        email_format: "{first}.{last}@{domain}"
    - inspy:
        mode: "both"
    - virustotal
    - h8mail
    - waymore:
        mode: "U"

passive:
  description: "All 30 passive tools — comprehensive passive recon, zero target interaction"
  inherits: standard
  tools:
    - spiderfoot:
        use_case: "passive"
    - sherlock:
        batch: true
        csv: true
    - maigret
    - holehe
    - goodork
    - datasploit:
        mode: "full"
    - snitch:
        mode: "full"
    - vcsmap:
        mode: "full"
    - creepy:
        mode: "social"
    # Phone & Identity (passive)
    - numverify
    - twilio_lookup
    - censys
    - intelx
    - hudson_rock
    - consumer_identity_reference

active:
  description: "Active recon only — direct interaction with target (requires explicit auth)"
  tools:
    - spiderfoot:
        use_case: "all"
    - recon_ng:
        modules: "active_set"
    - xray:
        mode: "full"
    - linkedin2username:
        depth: 5
        sleep: 3
    - linkedint:
        mode: "full"
    - httpx:
        follow_redirects: true
    - naabu:
        top_ports: "1000"
    - shuffledns
    - katana:
        headless: true
        depth: 3

full:
  description: "All 28 tools — passive + active combined"
  inherits: passive
  tools:
    - spiderfoot:
        use_case: "all"
    - recon_ng:
        modules: "active_set"
    - xray:
        mode: "full"
    - linkedin2username:
        depth: 5
        sleep: 3
    - linkedint:
        mode: "full"

phone:
  description: "Phone number recon — validation, carrier, threat intel (cheapest first)"
  tools:
    - numverify
    - twilio_lookup
    - intelx
    - hudson_rock
    - consumer_identity_reference

identity:
  description: "Identity recon — threat intel, phone, breach, platform check"
  tools:
    - intelx
    - hudson_rock
    - numverify
    - twilio_lookup
    - consumer_identity_reference
    - holehe
    - h8mail

commercial_identity:
  description: "FCRA-gated commercial identity — requires --authorization AND --fcra-permissible-purpose"
  tools:
    - whitepages_pro
    - beenverified

infrastructure:
  description: "Passive domain and infrastructure intelligence — subdomains, certificates, WHOIS, DNS, ASN, CDN"
  tools:
    - subfinder:
        all_sources: true
    - crtsh:
        wildcard: true
    - whois
    - theharvester:
        sources: "google,bing,dnsdumpster"
    - shodan:
        mode: "search"
    - brave_search:
        queries: "subdomains"
    - uncover:
        engines: "shodan,censys"
    - tlsx
    - asnmap
    - cdncheck
    - alterx

threat-intel:
  description: "Threat intelligence and breach exposure — reputation, breaches, archived attack surface, CVEs"
  tools:
    - virustotal
    - h8mail
    - waymore:
        mode: "U"
    - shodan:
        mode: "search"
    - cvemap:
        severity: "critical,high"

metadata:
  description: "Document and metadata focused recon"
  tools:
    - metagoofil:
        filetypes: "pdf,doc,xls,ppt,docx,xlsx,pptx,odp,ods"
        max_results: 200
    - exiftool:
        mode: "post_metagoofil"
    - dork_cli:
        dorks: "filetype_dorks"
    - brave_search:
        queries: "documents"
    - inspy:
        mode: "techspy"

social:
  description: "People and social media focused recon"
  tools:
    - theharvester:
        sources: "linkedin,google,bing"
    - spiderfoot:
        use_case: "investigate"
        target_type: "person_name"
    - creepy:
        mode: "social"
    - crosslinked:
        email_format: "{first}.{last}@{domain}"
    - inspy:
        mode: "empspy"
    - sherlock:
        batch: true
        csv: true
    - maigret
    - holehe

people:
  description: "People and employee reconnaissance — LinkedIn enumeration, username discovery, social profile mapping"
  tools:
    - crosslinked:
        email_format: "{first}.{last}@{domain}"
    - inspy:
        mode: "both"
    - sherlock:
        batch: true
        csv: true
    - maigret
    - holehe
    - theharvester:
        sources: "linkedin,google,bing"

subdomain_takeover:
  description: "Subdomain takeover detection — enumerate subdomains, resolve CNAMEs, fingerprint dangling records"
  tools:
    - subfinder:
        all_sources: true
    - crtsh:
        wildcard: true
    - dnsx_cname
    - subzy:
        concurrency: 10
    - nuclei_takeovers
  optional_dns_bruteforce:
    enabled: false          # off by default — 3M entries, runs slow
    wordlist: "{WORDLISTS_PATH}/n0kovo_subdomains/n0kovo_subdomains_huge.txt"
    tool: dnsx
    concurrency: 100
    notes: >
      Passive DNS brute-force via dnsx against the n0kovo_subdomains wordlist —
      prefixes extracted from valid TLS certs across the entire IPv4 space, so
      every entry was proven live somewhere. Higher signal than permutation lists.
      Only enable for deep-dive engagements or large-scope bug bounty targets.
      Expect 30-90 minute runtime. Run overnight. CLI: 'ohsint takeover --dns-bruteforce'.
  notes: >
    Detection only — does not claim resources or interact with provider accounts.
    Uses dedicated TakeoverPipeline for sequential data-flow chaining.
    Invoke via 'ohsint takeover' CLI command or osint_subdomain_takeover MCP tool.

url_harvest:
  description: "Historical URL harvesting — Wayback Machine, Common Crawl, OTX, pattern matching"
  tools:
    - gau:
        subs: true
        threads: 5
    - waybackurls
    - waymore:
        mode: "U"
    - gf_patterns
  notes: >
    Output feeds into js_analysis pipeline (js_urls.txt).
    Invoke via 'ohsint url-harvest' CLI command or osint_url_harvest MCP tool.

secret_surface:
  description: "Secret surface discovery — GitHub, Docker Hub, Postman, TruffleHog, Gitleaks"
  tools:
    - github_code_search
    - docker_hub_search
    - postman_workspace_search
    - trufflehog_github
    - trufflehog_docker
    - trufflehog_postman
    - gitleaks
  notes: >
    TruffleHog --only-verified only. Never stores raw secrets.
    Invoke via 'ohsint secret-surface' CLI command or osint_secret_surface MCP tool.

js_analysis:
  description: "JavaScript file analysis — endpoint extraction, secret detection, source maps"
  tools:
    - subjs
    - getjs
    - linkfinder
    - secretfinder
  notes: >
    Accepts js_urls.txt from url_harvest as input.
    Invoke via 'ohsint js-analysis' CLI command or osint_js_analysis MCP tool.

osint_passive_full:
  description: "Full passive OSINT — takeover + URL harvest + secret surface + JS analysis"
  tools: []
  notes: >
    Chains all 4 passive pipelines with cross-pipeline data flow.
    Estimated runtime: 30-90 minutes. Invoke via 'ohsint passive-full' or osint_passive_full.
