# OhSINT — Pipeline Default Configuration
#
# Tunable parameters for each pipeline module.
# Override via environment variables: OSINT_<PIPELINE>_<KEY> (uppercased).

url_harvest:
  gau_max_urls: 500000          # Cap total URLs from gau (large orgs produce millions)
  waymore_delay_seconds: 2      # Rate limit for Wayback Machine queries
  crtsh_delay_seconds: 1        # Rate limit for crt.sh CDX queries
  robots_max_snapshots: 200     # Max robots.txt Wayback snapshots to fetch

secret_surface:
  github_search_delay_seconds: 3  # GitHub Search API: 30 req/min authenticated
  docker_max_images: 20           # Max Docker Hub images to scan per org
  docker_max_image_size_mb: 500   # Skip images larger than this
  trufflehog_timeout: 600         # Per-repo/image timeout for TruffleHog (seconds)

js_analysis:
  js_max_file_size_mb: 5          # Skip JS files larger than this
  js_max_files: 500               # Cap total JS files to download
  disable_sourcemap_recovery: false  # Set true to skip .map file checks
  seclists_api_paths: true        # Use SecLists swagger.txt + api/api-endpoints.txt as path source
  seclists_api_max_paths: 1000    # Cap total API-doc paths probed per host (keeps it passive-scale)
  swagger_common_paths:           # Hardcoded fallback — always used if SecLists missing
    - /swagger.json
    - /swagger/v1/swagger.json
    - /swagger-ui.html
    - /swagger-ui/index.html
    - /api-docs
    - /v2/api-docs
    - /v3/api-docs
    - /openapi.json
    - /docs
    - /redoc

vendor_risk:
  # Risk scorecard rubric — opinionated defaults, tune to your risk appetite.
  # Score starts at 100; each category subtracts penalty (per_finding × severity
  # multiplier, summed, then capped). Final letter grade from `grades` thresholds.
  # Override any of categories / severity_multipliers / grades here; omitted keys
  # fall back to the built-in DEFAULT_RUBRIC in src/pipelines/vendor_risk.py.
  categories:
    breach_exposure:
      label: "Breach & credential exposure"
      types: ["breach", "credential", "infostealer"]
      per_finding: 8
      cap: 40
      weight: 1.0
    secret_leakage:
      label: "Leaked secrets"
      types: ["leaked_secret"]
      per_finding: 10
      cap: 40
      weight: 1.0
    attack_surface:
      label: "Exposed attack surface"
      types: ["subdomain_takeover", "exposed_api_doc", "sensitive_file", "port_service"]
      per_finding: 4
      cap: 30
      weight: 1.0
    vulnerabilities:
      label: "Known vulnerabilities"
      types: ["vulnerability"]
      per_finding: 6
      cap: 30
      weight: 1.0
    hygiene:
      label: "Hygiene & footprint"
      types: ["js_endpoint", "dns_record", "technology"]
      per_finding: 1
      cap: 15
      weight: 1.0
  severity_multipliers:
    critical: 2.0
    high: 1.5
    medium: 1.0
    low: 0.5
    info: 0.25
  grades:
    - {min: 90, grade: "A"}
    - {min: 80, grade: "B"}
    - {min: 70, grade: "C"}
    - {min: 60, grade: "D"}
    - {min: 0, grade: "F"}
